<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="The wordmark discorver dissolving into open space">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.42" stop-color="#ffffff"/>
      <stop offset="0.74" stop-color="#000000"/>
    </linearGradient>
    <mask id="dissolve">
      <rect width="1200" height="630" fill="url(#fade)"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="#FAF8F4"/>

  <text x="150" y="360" font-family="'Helvetica Neue', 'Inter', Arial, sans-serif"
        font-size="168" font-weight="600" letter-spacing="-6" fill="#1A1A1A"
        mask="url(#dissolve)">discorver</text>

  <!-- charcoal particles drifting off the trailing edge -->
  <g fill="#1A1A1A">
    <circle cx="708" cy="300" r="6" opacity="0.55"/>
    <circle cx="744" cy="262" r="4" opacity="0.45"/>
    <circle cx="766" cy="338" r="5" opacity="0.40"/>
    <circle cx="800" cy="296" r="3" opacity="0.38"/>
    <circle cx="828" cy="244" r="4" opacity="0.30"/>
    <circle cx="852" cy="356" r="3" opacity="0.30"/>
    <circle cx="888" cy="312" r="5" opacity="0.24"/>
    <circle cx="916" cy="276" r="2.5" opacity="0.22"/>
    <circle cx="950" cy="338" r="3" opacity="0.18"/>
    <circle cx="992" cy="298" r="2.5" opacity="0.15"/>
    <circle cx="1036" cy="266" r="2" opacity="0.12"/>
    <circle cx="1078" cy="320" r="2.5" opacity="0.10"/>
  </g>

  <!-- muted slate-blue accent particles -->
  <g fill="#6B7A8F">
    <circle cx="730" cy="320" r="4" opacity="0.55"/>
    <circle cx="784" cy="252" r="3" opacity="0.45"/>
    <circle cx="836" cy="318" r="3.5" opacity="0.38"/>
    <circle cx="902" cy="350" r="2.5" opacity="0.30"/>
    <circle cx="958" cy="278" r="3" opacity="0.26"/>
    <circle cx="1014" cy="332" r="2.5" opacity="0.18"/>
    <circle cx="1066" cy="288" r="2" opacity="0.14"/>
    <circle cx="1120" cy="312" r="2" opacity="0.10"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="discorver giving way to discorverx">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.40" stop-color="#ffffff"/>
      <stop offset="0.86" stop-color="#000000"/>
    </linearGradient>
    <mask id="dissolve">
      <rect width="1200" height="630" fill="url(#fade)"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="#FAF8F4"/>

  <!-- old name, fading out -->
  <text x="600" y="262" text-anchor="middle"
        font-family="'Helvetica Neue', 'Inter', Arial, sans-serif"
        font-size="104" font-weight="500" letter-spacing="-3" fill="#1A1A1A"
        opacity="0.42" mask="url(#dissolve)">discorver</text>

  <!-- particles bridging old to new -->
  <g fill="#6B7A8F">
    <circle cx="548" cy="320" r="3" opacity="0.45"/>
    <circle cx="600" cy="330" r="3.5" opacity="0.5"/>
    <circle cx="652" cy="322" r="2.5" opacity="0.4"/>
    <circle cx="582" cy="346" r="2" opacity="0.35"/>
    <circle cx="624" cy="348" r="2.5" opacity="0.35"/>
  </g>
  <!-- soft downward arrow -->
  <path d="M600 300 L600 352 M584 338 L600 354 L616 338"
        stroke="#6B7A8F" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- new name, fully formed -->
  <text x="600" y="430" text-anchor="middle"
        font-family="'Helvetica Neue', 'Inter', Arial, sans-serif"
        font-size="120" font-weight="600" letter-spacing="-4" fill="#1A1A1A">discorverx</text>
</svg>

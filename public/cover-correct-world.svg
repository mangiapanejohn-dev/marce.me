<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Two histories that end in the same world: in one the criterion is true, in the other false">
  <rect width="1200" height="630" fill="#FAF8F4"/>
  <g font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">
    <!-- history A -->
    <text x="150" y="150" font-size="30" fill="#3f6b4f">history A</text>
    <rect x="150" y="172" width="360" height="64" rx="10" fill="#dfe8dc" stroke="#3f6b4f" stroke-width="2"/>
    <text x="172" y="214" font-size="28" fill="#262521">notes = "the note"</text>
    <!-- history B -->
    <text x="690" y="150" font-size="30" fill="#9b3a33">history B</text>
    <rect x="690" y="172" width="360" height="64" rx="10" fill="#f1d9d4" stroke="#9b3a33" stroke-width="2"/>
    <text x="712" y="214" font-size="28" fill="#262521">notes = "other"</text>
    <!-- converge -->
    <path d="M330,236 C330,320 600,300 600,356" fill="none" stroke="#4a4842" stroke-width="2.5"/>
    <path d="M870,236 C870,320 600,300 600,356" fill="none" stroke="#4a4842" stroke-width="2.5"/>
    <polygon points="600,368 591,350 609,350" fill="#4a4842"/>
    <rect x="330" y="372" width="540" height="72" rx="10" fill="#f4dfd3" stroke="#c4623f" stroke-width="2"/>
    <text x="600" y="418" font-size="30" fill="#262521" text-anchor="middle">archive = "the note"</text>
    <text x="600" y="520" font-size="44" fill="#c4623f" text-anchor="middle">same world, different truth</text>
  </g>
</svg>

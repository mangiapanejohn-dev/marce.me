<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="A terminal showing fatal: not a git repository">
  <rect width="1200" height="560" fill="#FAF8F4"/>

  <!-- terminal window -->
  <rect x="160" y="70" width="880" height="420" rx="14" fill="#1E1E1E"/>
  <!-- title bar -->
  <rect x="160" y="70" width="880" height="48" rx="14" fill="#2A2A2A"/>
  <rect x="160" y="100" width="880" height="18" fill="#2A2A2A"/>
  <circle cx="192" cy="94" r="7" fill="#FF5F56"/>
  <circle cx="216" cy="94" r="7" fill="#FFBD2E"/>
  <circle cx="240" cy="94" r="7" fill="#27C93F"/>

  <g font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="26">
    <text x="200" y="186" fill="#8A8A8A">$ <tspan fill="#D6D6D6">cd ~/discorverx</tspan></text>
    <text x="200" y="232" fill="#E06C75">cd: no such file or directory: ~/discorverx</text>

    <text x="200" y="300" fill="#8A8A8A">$ <tspan fill="#D6D6D6">git status</tspan></text>
    <text x="200" y="346" fill="#E06C75">fatal: not a git repository</text>

    <text x="200" y="414" fill="#8A8A8A">$ <tspan fill="#5C6370">_</tspan></text>
  </g>
</svg>

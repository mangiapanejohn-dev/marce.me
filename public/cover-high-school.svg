      <rect x="150" y="312" width="150" height="72" rx="8"/><rect x="330" y="312" width="150" height="72" rx="8"/><rect x="690" y="312" width="150" height="72" rx="8"/><rect x="870" y="312" width="150" height="72" rx="8"/>
      <rect x="150" y="408" width="150" height="72" rx="8"/><rect x="330" y="408" width="150" height="72" rx="8"/><rect x="690" y="408" width="150" height="72" rx="8"/><rect x="870" y="408" width="150" height="72" rx="8"/>

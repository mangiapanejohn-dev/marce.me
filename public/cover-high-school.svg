  <g>
    <!-- the timetable -->
    <g fill="#1A1A1A" opacity="0.24">
      <rect x="150" y="120" width="150" height="72" rx="8"/><rect x="330" y="120" width="150" height="72" rx="8"/><rect x="510" y="120" width="150" height="72" rx="8"/><rect x="690" y="120" width="150" height="72" rx="8"/><rect x="870" y="120" width="150" height="72" rx="8"/>

<text x="20" y="311" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#edebe3" text-anchor="start">109 / 109 pairs on pre-existing resources had the pre-state captured (57 receipt digest, 52 earlier observation).</text>
<text x="20" y="330" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#edebe3" text-anchor="start">75 / 75 applied overwrites of existing files carry a basis observation; 55 are full-content file reads.</text>

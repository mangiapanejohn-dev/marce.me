<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" role="img" aria-labelledby="t d">
<title id="t">Load lowers the backup rule, not the standing approval; the probe detects asks and a grant removes them</title>
<desc id="d">Under 30 constraints the backup rule fell from 39 of 39 to 116 of 152 on opus-4-6 and from 29 of 36 to 78 of 157 on haiku-4-5, while no delete turn under a standing approval produced an approval request at either load. Without a grant, opus asked at the first deletion in 3 of 3 seeds, haiku in 1 of 3; with one, 0 of 6 each. After a runtime approval reply, 0 of 9 later deletions were re-asked. Most backup failures wrote no backup at all.</desc>
<text x="20" y="26" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b6a63" text-anchor="start">S3 · opus-4-6 and haiku-4-5 · 2 or 30 active constraints · 10 turns · 3 seeds per cell</text>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="704" viewBox="0 0 720 704" role="img" aria-labelledby="t d">
<title id="t">Where each rule lived, and what held</title>
<desc id="d">The model could delete in every arm. Rules delivered as text the model reads: a standing grant held in 52 delete turns; a backup rule fell 24 to 31 points under load; an approval reply held 9 of 9 in one experiment and not in 2 of 3 in another. Rules held as runtime state and checked before dispatch: MØBIUS approvals, typed constraints that no goal in the corpus used, and OS sandboxes. Completion decided by the criterion&#x27;s grammar: a state predicate is established whoever wrote the file; an accomplishment predicate is not.</desc>
<rect x="20" y="14" width="680" height="46" rx="8" fill="#2f3f4a" stroke="#9cc3de" stroke-width="1"/>
<text x="36" y="34" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9cc3de" text-anchor="start">Capability: the model could delete in every arm</text>
<text x="36" y="51" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#edebe3" text-anchor="start">74 of 75 delete turns removed the target; the 75th hit the step cap. haiku, with no grant, deleted 10 of 10 without asking.</text>
<rect x="20" y="76" width="680" height="218" rx="10" fill="#36352f" stroke="#e2c38a" stroke-width="1"/>
<text x="36" y="100" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" font-weight="800" fill="#e2c38a" text-anchor="start">Held as text the model reads</text>
<text x="684" y="100" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.3" font-weight="400" fill="#b9b7ad" text-anchor="end" font-style="italic">nothing checks it before the effect</text>
<text x="36" y="120" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#edebe3" text-anchor="start">standing grant, turn-0 prompt (“do not use ask_⁠approval”)</text>
<text x="36" y="136.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b9b7ad" text-anchor="start">0 approval requests in 52 delete turns; opus asked 3 of 3 without it</text>
<text x="684" y="120" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#a9c9b1" text-anchor="end">no asks</text>
<text x="36" y="162.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#edebe3" text-anchor="start">backup rule, same prompt (“write .bak first”)</text>
<text x="36" y="178.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b9b7ad" text-anchor="start">opus 1.00 → 0.76, haiku 0.81 → 0.50 under 30 constraints; failures skipped the step</text>
<text x="684" y="162.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#eba59c" text-anchor="end">fell 24–31 pp</text>
<text x="36" y="205.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#edebe3" text-anchor="start">approval reply (“do not ask again for operations of this kind”)</text>
<text x="36" y="221.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b9b7ad" text-anchor="start">S3: 0 of 9 later deletions re-asked · pilot, sonnet-5: 2 of 3 asked again, conditionally</text>
<text x="684" y="205.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e2c38a" text-anchor="end">mixed</text>
<text x="36" y="247.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#edebe3" text-anchor="start">Claude Code documentation on CLAUDE.md</text>
<text x="36" y="263.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b9b7ad" text-anchor="start">“context, not enforced configuration”</text>
<text x="684" y="247.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#b9b7ad" text-anchor="end">by design</text>
<rect x="20" y="310" width="680" height="218" rx="10" fill="#36352f" stroke="#9cc3de" stroke-width="1"/>
<text x="36" y="334" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" font-weight="800" fill="#9cc3de" text-anchor="start">Held as runtime state, checked before dispatch</text>
<text x="684" y="334" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.3" font-weight="400" fill="#b9b7ad" text-anchor="end" font-style="italic">the model is not asked to remember</text>
<text x="36" y="354" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#edebe3" text-anchor="start">MØBIUS approval (V65, K8)</text>
<text x="36" y="370.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b9b7ad" text-anchor="start">recomputed against the world it was granted over; “an answered question is not asked again”</text>
<text x="684" y="354" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#9cc3de" text-anchor="end">gate</text>
<text x="36" y="396.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#edebe3" text-anchor="start">MØBIUS typed constraints and protected invariants</text>
<text x="36" y="412.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b9b7ad" text-anchor="start">refused before dispatch — and written on 0 of 159 goals in its own corpus</text>
<text x="684" y="396.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e2c38a" text-anchor="end">unused</text>
<text x="36" y="439.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#edebe3" text-anchor="start">OS sandbox (Seatbelt, bubblewrap)</text>
<text x="36" y="455.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b9b7ad" text-anchor="start">Claude Code docs: holds “regardless of what the model chose to run” — but not against egress through an allowed host</text>
<text x="684" y="439.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#9cc3de" text-anchor="end">boundary</text>
<text x="36" y="481.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#edebe3" text-anchor="start">pre-state capture before an overwrite</text>
<text x="36" y="497.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b9b7ad" text-anchor="start">MØBIUS corpus 109 of 109 pairs — other tasks, one model, no load: not a controlled comparison</text>
<text x="684" y="481.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#a9c9b1" text-anchor="end">captured</text>
<rect x="20" y="544" width="680" height="136" rx="10" fill="#36352f" stroke="#e08a6b" stroke-width="1"/>
<text x="36" y="568" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" font-weight="800" fill="#e08a6b" text-anchor="start">Decided by the criterion's grammar</text>
<text x="684" y="568" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.3" font-weight="400" fill="#b9b7ad" text-anchor="end" font-style="italic">what “done” means</text>
<text x="36" y="588" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#edebe3" text-anchor="start">state predicate (“notes.md is an index linking the three files”)</text>
<text x="36" y="604.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b9b7ad" text-anchor="start">established 10 of 21 whether this run or another writer made it so (F = N = S, 21/21)</text>
<text x="684" y="588" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e2c38a" text-anchor="end">authorship invisible</text>
<text x="36" y="630.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#edebe3" text-anchor="start">accomplishment predicate (“this run's own effects brought about …”)</text>
<text x="36" y="646.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b9b7ad" text-anchor="start">another writer: 20 of 21 not-established · this run: 21 of 21 unchanged</text>
<text x="684" y="630.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#a9c9b1" text-anchor="end">authorship decides</text>
</svg>

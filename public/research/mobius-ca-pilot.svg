<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="t d">
<title id="t">Pilot: neither constraint decayed over 10 turns; without the grant, asks came only on delete turns</title>
<desc id="d">claude-sonnet-5, two constraints, ten turns, three seeds per arm. With the standing grant, the grant held on every turn and the backup rule on every turn that had something to back up. Without the grant, five approval requests, all on turns 6 and 9, the only turns that asked for a deletion.</desc>

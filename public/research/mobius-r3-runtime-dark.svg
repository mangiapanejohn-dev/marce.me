<svg xmlns="http://www.w3.org/2000/svg" width="500" height="760" viewBox="0 0 500 760" role="img" aria-labelledby="t d">
<title id="t">The MØBIUS runtime as it stands at f9b27dd</title>
<desc id="d">Model and cognition propose intents, looks and judgements through the model port. The runtime loop owns authority, routing, world and version binding, observation, execution, verification, evidence and completion, and the journal. Effects reach the world through environment providers.</desc>
<rect x="20" y="16" width="460" height="86" rx="8" fill="#2f3f4a" stroke="#9cc3de" stroke-width="1"/>
<text x="36" y="40" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9cc3de" text-anchor="start">Model / cognition  ·  advisory, never authoritative</text>
<text x="36" y="62" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#edebe3" text-anchor="start">proposer (intent-source) · look (observation-source)</text>
<text x="36" y="79" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#edebe3" text-anchor="start">criterion judge (criterion-judge, ADR 0043) · Claude CLI / OpenAI transports</text>
<line x1="250" y1="108" x2="250.0" y2="130.0" stroke="#c9c6ba" stroke-width="1.2"/>
<polygon points="250.0,130.0 246.5,123.0 253.5,123.0" fill="#c9c6ba"/>

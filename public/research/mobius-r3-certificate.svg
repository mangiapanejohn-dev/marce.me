<text x="46" y="295" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#262521" text-anchor="start">(nothing says notes.txt is gone)</text>

<text x="250" y="352" font-family="'STIX Two Math', 'Cambria Math', Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#262521" text-anchor="middle">J<tspan baseline-shift="sub" font-size="72%">i</tspan> ⊈ C<tspan baseline-shift="sub" font-size="72%">i</tspan></text>
<text x="20" y="384" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#6b6a63" text-anchor="start">R3 P3: 11 judge-bound criteria in completed runs; J ⊆ C in 0 of 11.</text>
<text x="20" y="401" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#6b6a63" text-anchor="start">In 8 of the 11 the omitted evidence carries part of what the judge's own reason cites.</text>
<text x="20" y="418" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#6b6a63" text-anchor="start">The journal's criterion.judged event still names J — the gap is in the certificate,</text>
<text x="20" y="435" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#6b6a63" text-anchor="start">not in the log.</text>

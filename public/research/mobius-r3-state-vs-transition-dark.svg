<svg xmlns="http://www.w3.org/2000/svg" width="500" height="482" viewBox="0 0 500 482" role="img" aria-labelledby="t d">
<title id="t">Post-state evidence against transition evidence</title>
<desc id="d">Left: with only the post-state, a judge sees archive.txt holding &#x27;the note&#x27; and notes.txt absent, and cannot tell whether that was notes.txt&#x27;s former content. Right: a pre-state digest, the move, and the post-state digest let the relation be checked mechanically.</desc>
<text x="20" y="26" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#eba59c" text-anchor="start">POST STATE ONLY</text>
<rect x="20" y="38" width="460" height="124" rx="8" fill="#4f3432" stroke="#eba59c" stroke-width="1"/>
<text x="38" y="64" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#edebe3" text-anchor="start">archive.txt  =  "the note"</text>
<text x="38" y="84" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#edebe3" text-anchor="start">notes.txt    absent</text>
<text x="38" y="118" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#edebe3" text-anchor="start">criterion: archive.txt holds the former content of notes.txt</text>
<text x="38" y="136" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#edebe3" text-anchor="start">former content of notes.txt = ?   → not in the evidence</text>
<text x="38" y="154" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#edebe3" text-anchor="start">verdict that is justified:  cannot-tell</text>
<text x="20" y="188" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#a9c9b1" text-anchor="start">PRE  →  ACTION  →  POST   (a transition witness)</text>
<rect x="20" y="200" width="460" height="270" rx="8" fill="#34423a" stroke="#a9c9b1" stroke-width="1"/>
<rect x="38" y="220" width="424" height="44" rx="6" fill="#36352f" stroke="#55534b" stroke-width="1"/>
<text x="50" y="238" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#b9b7ad" text-anchor="start">pre   W<tspan baseline-shift="sub" font-size="72%">t</tspan></text>
<text x="50" y="255" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#edebe3" text-anchor="start">notes.txt  digest 6862e4…</text>
<rect x="38" y="284" width="424" height="44" rx="6" fill="#36352f" stroke="#55534b" stroke-width="1"/>
<text x="50" y="302" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#b9b7ad" text-anchor="start">action A<tspan baseline-shift="sub" font-size="72%">t</tspan></text>
<text x="50" y="319" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#edebe3" text-anchor="start">fs.move(notes.txt → archive.txt)</text>
<rect x="38" y="348" width="424" height="44" rx="6" fill="#36352f" stroke="#55534b" stroke-width="1"/>
<text x="50" y="366" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#b9b7ad" text-anchor="start">post  W<tspan baseline-shift="sub" font-size="72%">t+1</tspan></text>
<text x="50" y="383" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#edebe3" text-anchor="start">archive.txt digest 6862e4… · notes.txt absent</text>
<line x1="250" y1="264" x2="250.0" y2="282.0" stroke="#c9c6ba" stroke-width="1.2"/>
<polygon points="250.0,282.0 246.5,275.0 253.5,275.0" fill="#c9c6ba"/>
<line x1="250" y1="328" x2="250.0" y2="346.0" stroke="#c9c6ba" stroke-width="1.2"/>
<polygon points="250.0,346.0 246.5,339.0 253.5,339.0" fill="#c9c6ba"/>
<text x="38" y="414" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#edebe3" text-anchor="start">relation R<tspan baseline-shift="sub" font-size="72%">t</tspan>:  digest(notes<tspan baseline-shift="sub" font-size="72%">pre</tspan>) = digest(archive<tspan baseline-shift="sub" font-size="72%">post</tspan>)</text>
<text x="38" y="434" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#edebe3" text-anchor="start">∧ exists(notes<tspan baseline-shift="sub" font-size="72%">post</tspan>) = false   ⇒   the criterion is entailed</text>
<text x="38" y="456" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#b9b7ad" text-anchor="start" font-style="italic">In R3 P3 every such pre-state was in the journal — just not in the judge's view.</text>
</svg>

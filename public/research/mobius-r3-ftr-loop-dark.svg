<svg xmlns="http://www.w3.org/2000/svg" width="500" height="800" viewBox="0 0 500 800" role="img" aria-labelledby="t d">
<title id="t">FTR as a candidate closed loop</title>
<desc id="d">Reality and history feed a versioned world W_t. The FTR state holds possible futures, disagreement, future evidence requirements, risk, proof-failure probability and calibration. It informs a runtime meta-decision among act, observe, test, ask, fork, replan, preserve and wait. The action changes the world; forecasts resolve as satisfied, violated or void; calibration updates; a new FTR state follows.</desc>
